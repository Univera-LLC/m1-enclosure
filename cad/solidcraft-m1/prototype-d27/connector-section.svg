<text x="43" y="145" class="ey" text-anchor="start">УСЕРЕДИНІ</text><text x="499" y="145" class="ey" text-anchor="end">ЗОВНІ</text>
<text x="541" y="150" class="lab" text-anchor="start">Пластик — штрихування</text>
<text x="541" y="174" class="tiny" text-anchor="start">Капсула 9,10 × 3,30 мм; стінка перед TB — 0,90 мм.</text>
<text x="541" y="194" class="tiny" text-anchor="start">Спільний паз TB поглиблено до Y = 55,56 мм</text>
<text x="541" y="214" class="tiny" text-anchor="start">(стінка 1,80 мм; суцільне поле — 2,60 мм).</text>
<text x="541" y="253" class="lab" text-anchor="start">Гніздо й екран — темно-зеленим</text>
<text x="541" y="277" class="tiny" text-anchor="start">Широка рамка TB заходить у глибоку кишеню,</text>
<text x="541" y="297" class="tiny" text-anchor="start">а задній екран (Y = 55,11) має +0,45 мм запасу.</text>
<text x="541" y="317" class="tiny" text-anchor="start">Номінальне повітря перед TB: 0,11 мм.</text>
<text x="541" y="355" class="lab" text-anchor="start">Кабель — світло-зеленим, приклад</text>
<text x="541" y="379" class="tiny" text-anchor="start">За шийки 1,20 мм широке плече лишається</text>
<text x="541" y="399" class="tiny" text-anchor="start">на 0,19 мм перед лицем. Заводський Apple має</text>
<text x="541" y="419" class="tiny" text-anchor="start">~1,0 мм стінку — стандартні TB-кабелі стають штатно.</text>
<path d="M27 476H903" stroke="#acbcb1"/>
<text x="27" y="500" class="ey" text-anchor="start">ЗБІЛЬШЕНО ВЗДОВЖ ОСІ   /   ЧЕРВОНИЙ ШТРИХ НА РОЗРІЗІ</text>
<rect x="51" y="520" width="99.00" height="20" fill="#475c52"/>
<rect x="150" y="520" width="19.80" height="20" fill="#f9f9f3" stroke="#96a89b"/>
<rect x="169.80" y="520" width="162.00" height="20" fill="url(#d26hatch)" stroke="#9a784a"/>
<path d="M331.80 511v39" stroke="#197b56" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="51" y="560" class="tiny" text-anchor="start">Рамка</text><text x="142" y="560" class="tiny" text-anchor="start">Повітря</text><text x="218" y="560" class="tiny" text-anchor="start">Пластик 0,90 мм</text>
<text x="368" y="530" class="lab" text-anchor="start">Торець TB → лице: 0,11 + 0,90 = 1,01 мм</text>
<text x="368" y="552" class="tiny" text-anchor="start">Номінали CAD (9 шарів по 0,10 мм); перевіряється приміркою.</text>
<text x="27" y="588" class="tiny" text-anchor="start">Базис: X = −19,05 мм, фасад Y = 57,36 мм. Фізичний друк D2.6 ще не виконано й не прийнято.</text>
</svg>
