<svg xmlns="http://www.w3.org/2000/svg" id="antphoto-shapes" viewBox="0 0 400 484" data-panel-a="0 0 400 239" data-panel-b="0 245 400 239" role="img" aria-labelledby="antphoto-title antphoto-desc" font-family="system-ui, Segoe UI, Arial, sans-serif">
  <title id="antphoto-title">Два зняті антенні вузли: A — компактний, Б — видовжений</title>
  <desc id="antphoto-desc">Ручні обриси з фотографій без масштабу. У A показано лицьову ділянку, чорні накладки та вушко. У Б видно зворотний бік, вигнутий край, вихід кабелю й кінцевий відгин. Ракурси та збільшення різні; це не розгортки і не посадкові креслення.</desc>

  <rect x="1" y="1" width="398" height="237" rx="12" fill="#f3f5f0" stroke="#bdc7bd"/>
  <rect x="1" y="246" width="398" height="237" rx="12" fill="#f3f5f0" stroke="#bdc7bd"/>
