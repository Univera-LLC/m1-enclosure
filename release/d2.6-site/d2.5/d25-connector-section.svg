<text x="43" y="145" class="ey" text-anchor="start">УСЕРЕДИНІ</text><text x="499" y="145" class="ey" text-anchor="end">ЗОВНІ</text>
<text x="541" y="150" class="lab" text-anchor="start">Пластик — штрихування</text>
<text x="541" y="174" class="tiny" text-anchor="start">Відкритою лишається капсула 9,10 × 3,30 мм.</text>
<text x="541" y="194" class="tiny" text-anchor="start">Перед рамкою TB — 0,30 мм пластику;</text>
<text x="541" y="214" class="tiny" text-anchor="start">товщина суцільного поля — 2,00 мм.</text>
<text x="541" y="253" class="lab" text-anchor="start">Гніздо — темно-зеленим</text>
<text x="541" y="277" class="tiny" text-anchor="start">Широка рамка заходить у задню кишеню.</text>
<text x="541" y="297" class="tiny" text-anchor="start">Між рамкою та пластиком номінально 0,11 мм.</text>
<text x="541" y="317" class="tiny" text-anchor="start">Пунктир показує зовнішню площину панелі.</text>
<text x="541" y="355" class="lab" text-anchor="start">Кабель — світло-зеленим, приклад</text>
<text x="541" y="379" class="tiny" text-anchor="start">За шийки 0,65 мм широке плече лишається</text>
<text x="541" y="399" class="tiny" text-anchor="start">на 0,24 мм перед лицем. Якщо шийка 0,45 мм,</text>
<text x="541" y="419" class="tiny" text-anchor="start">розрахунковий запас становить лише 0,04 мм.</text>
<path d="M27 476H903" stroke="#acbcb1"/>
<text x="27" y="500" class="ey" text-anchor="start">ЗБІЛЬШЕНО ВЗДОВЖ ОСІ   /   ЧЕРВОНИЙ ШТРИХ НА РОЗРІЗІ</text>
<rect x="51" y="520" width="116.00" height="20" fill="#475c52"/>
<rect x="167" y="520" width="34.10" height="20" fill="#f9f9f3" stroke="#96a89b"/>
<rect x="201.10" y="520" width="93.00" height="20" fill="url(#d25hatch)" stroke="#9a784a"/>
<path d="M294.10 511v39" stroke="#197b56" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="51" y="560" class="tiny" text-anchor="start">Рамка</text><text x="155" y="560" class="tiny" text-anchor="start">Повітря</text><text x="221" y="560" class="tiny" text-anchor="start">Пластик</text>
<text x="352" y="530" class="lab" text-anchor="start">Торець TB → лице: 0,11 + 0,30 = 0,41 мм</text>
<text x="352" y="552" class="tiny" text-anchor="start">Це номінали CAD; розмір шийки реального штекера слід виміряти.</text>
<text x="27" y="588" class="tiny" text-anchor="start">Базис: X = −19,05 мм. Гніздо: зареєстрована модель, а не обмір Apple. Друк, міцність і фізичну посадку ще не перевірено.</text>
</svg>
