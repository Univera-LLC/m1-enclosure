<svg xmlns="http://www.w3.org/2000/svg" width="930" height="610" viewBox="0 0 930 610" role="img" aria-labelledby="d25secTitle d25secDesc">
<title id="d25secTitle">D2.5: справжній розріз через капсулу Thunderbolt</title>
<desc id="d25secDesc">Пластик перекриває широкий чорний обідок. Експортовані панель і гніздо розрізані в одній площині; носик і плече кабелю показані як окремий приклад.</desc>
<defs><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#20392e}.ey{font-size:12px;font-weight:650;letter-spacing:1.3px}.head{font-size:29px;font-weight:650}.sub{font-size:15px}.lab{font-size:16px;font-weight:650}.tiny{font-size:13px}.hi{fill:#37634f;font-weight:650}</style>
