<clipPath id="d25clip"><rect x="33" y="130" width="477" height="324" rx="5"/></clipPath></defs>
<rect width="930" height="610" rx="12" fill="#f9f9f3"/>
<text x="27" y="30" class="ey" text-anchor="start">D2.5   /   ЗАДНЯ ПАНЕЛЬ   /   РОЗРІЗ ЧЕРЕЗ ВІСЬ THUNDERBOLT 1</text>
<text x="27" y="69" class="head" text-anchor="start">Пластик закриває широкий обідок гнізда</text>
<text x="27" y="95" class="sub" text-anchor="start">Розріз друкованої панелі 02 і моделі плати в одному масштабі. Вид збоку; кабель заходить праворуч.</text>
